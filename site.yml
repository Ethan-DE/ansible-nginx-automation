---
- name: Configure NGINX web server
  hosts: web
  become: true

  tasks:
    - name: Install NGINX and UFW
      ansible.builtin.apt:
        name:
          - nginx
          - ufw
        state: present
        update_cache: true

    - name: Deploy index page
      ansible.builtin.template:
        src: templates/index.html.j2
        dest: /var/www/html/index.html
        owner: root
        group: root
        mode: "0644"
      notify: Reload NGINX

    - name: Allow HTTP through UFW
      community.general.ufw:
        rule: allow
        port: "80"
        proto: tcp

    - name: Enable NGINX
      ansible.builtin.service:
        name: nginx
        enabled: true
        state: started

  handlers:
    - name: Reload NGINX
      ansible.builtin.service:
        name: nginx
        state: reloaded
